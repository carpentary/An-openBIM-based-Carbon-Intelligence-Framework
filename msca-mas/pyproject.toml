[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msca-mas"
version = "0.2.0"
description = "Ontology-constrained multi-agent system for metro station carbon assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
  "pydantic>=2.8,<3",
  "rdflib>=7.0,<8",
]

[project.optional-dependencies]
validation = ["pyshacl>=0.30,<1"]
dev = ["pytest>=8,<10"]
retrieval = [
  "sentence-transformers==5.7.0",
  "transformers==5.16.1",
  "huggingface-hub==1.28.0",
]

[project.scripts]
msca-mas = "msca_mas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
msca_mas = ["resources/*.json", "resources/*.ttl", "resources/sparql_templates/*.rq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
